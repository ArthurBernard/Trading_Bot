name: CI

# Supply-chain / dependency-pinning posture
# -----------------------------------------
# GitHub Actions are pinned by **commit SHA** (not a moving `@v4`/`@v5` tag) so a
# retagged or compromised action cannot silently change what runs in CI; the
# trailing `# vX.Y.Z` comment records the human-readable version each SHA maps to
# (bump both together). Python tooling that must be byte-reproducible is pinned
# exactly in pyproject.toml (`ruff==` in the [dev] extra, mirrored by the
# pre-commit `ruff` hook rev) so `ruff format --check` below cannot drift between
# CI, the hook and a developer's machine. Runtime libs keep loose `>=` floors in
# pyproject for library consumers; a fully-locked/hashed CI install (pip-tools/uv)
# is the next step if reproducibility needs to extend to the whole dependency tree.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check trading_bot/

      - name: Format check (ruff format)
        # Enforce exactly what the pre-commit `ruff-format` hook auto-applies, so a
        # formatting drift can never wedge CI while passing the hook (or vice versa).
        run: ruff format --check .

      - name: Docstring coverage (interrogate)
        # Make the [tool.interrogate] fail-under floor real (was configured but run
        # by nothing); mirrors the pre-commit `interrogate` hook.
        run: interrogate trading_bot/

      - name: Type check (mypy)
        run: mypy trading_bot/

      - name: Test (pytest)
        run: pytest
